<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qbit-voter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-hover: #1a1a26;
      --border: #2a2a3a;
      --text: #e0e0e8;
      --text-dim: #6a6a80;
      --accent: #4ade80;
      --accent-dim: #22543d;
      --warning: #f59e0b;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Space Grotesk', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    .noise {
      position: fixed;
      inset: 0;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    header {
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-family: var(--mono);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    header h1 .dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .stats {
      display: flex;
      gap: 1.5rem;
      margin-top: 0.75rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-dim);
      align-items: center;
    }

    .stats span strong {
      color: var(--text);
    }

    .loading {
      text-align: center;
      padding: 4rem 0;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .loading .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      text-align: center;
      padding: 3rem;
      color: #ef4444;
      font-family: var(--mono);
      font-size: 0.85rem;
    }

    .empty {
      text-align: center;
      padding: 4rem 0;
      color: var(--text-dim);
    }

    .empty .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .empty p { font-size: 0.9rem; }

    .torrent-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .torrent-item {
      background: var(--surface);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: background 0.15s ease;
    }

    .torrent-item:hover {
      background: var(--surface-hover);
    }

    .torrent-item.voted {
      opacity: 0.4;
    }

    .torrent-info {
      flex: 1;
      min-width: 0;
    }

    .torrent-name {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.4;
      word-break: break-word;
      margin-bottom: 0.35rem;
    }

    .torrent-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.7rem;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .torrent-meta .size {
      background: var(--bg);
      padding: 0.15rem 0.45rem;
      border-radius: 3px;
    }

    .torrent-actions {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .btn {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-vote {
      background: transparent;
      color: var(--warning);
      border-color: var(--warning);
    }

    .btn-vote:hover {
      background: var(--warning);
      color: var(--bg);
    }

    .btn-done {
      background: transparent;
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn-done:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .btn-voted {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: var(--accent-dim);
      cursor: default;
    }

    .btn-no-url {
      background: transparent;
      color: var(--text-dim);
      border-color: var(--border);
      cursor: default;
    }

    .refresh-btn {
      font-family: var(--mono);
      font-size: 0.75rem;
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .refresh-btn:hover {
      color: var(--text);
      border-color: var(--text-dim);
    }

    @media (max-width: 600px) {
      .torrent-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }
      .torrent-actions {
        width: 100%;
      }
      .torrent-actions .btn {
        flex: 1;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="container">
    <header>
      <h1><span class="dot"></span> qbit-voter</h1>
      <div class="stats">
        <span>Pendents: <strong id="count">—</strong></span>
        <span>|</span>
        <button class="refresh-btn" onclick="loadTorrents()">↻ Refescar</button>
      </div>
    </header>
    <main id="app">
      <div class="loading">
        <div class="spinner"></div>
        Connectant a qBittorrent...
      </div>
    </main>
  </div>

  <script>
    let torrents = [];
    let votedTag = 'Liked';

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
    }

    function render() {
      const app = document.getElementById('app');
      const count = document.getElementById('count');
      const pending = torrents.filter(t => !t.voted);
      count.textContent = pending.length;

      if (torrents.length === 0) {
        app.innerHTML = `
          <div class="empty">
            <div class="icon">✓</div>
            <p>Tots els torrents estan etiquetats!</p>
          </div>`;
        return;
      }

      app.innerHTML = `
        <div class="torrent-list">
          ${torrents.map((t, i) => `
            <div class="torrent-item ${t.voted ? 'voted' : ''}" id="torrent-${i}">
              <div class="torrent-info">
                <div class="torrent-name">${escapeHtml(t.name)}</div>
                <div class="torrent-meta">
                  <span class="size">${formatSize(t.size)}</span>
                </div>
              </div>
              <div class="torrent-actions">
                ${t.voted
                  ? `<span class="btn btn-voted">✓ ${escapeHtml(votedTag)}</span>`
                  : t.url
                    ? `<a class="btn btn-vote" href="${escapeHtml(t.url)}" target="_blank" rel="noopener">★ Votar</a>
                       <button class="btn btn-done" onclick="markVoted(${i})">✓ Fet</button>`
                    : `<span class="btn btn-no-url">Sense URL</span>`
                }
              </div>
            </div>
          `).join('')}
        </div>`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function markVoted(index) {
      const torrent = torrents[index];
      try {
        const res = await fetch(`/api/torrents/${torrent.hash}/voted`, { method: 'POST' });
        if (res.ok) {
          torrent.voted = true;
          render();
        }
      } catch (err) {
        console.error('Error al marcar com a votat:', err);
      }
    }

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) {
          const config = await res.json();
          votedTag = config.votedTag;
        }
      } catch (err) {
        console.error('Error al carregar la configuració:', err);
      }
    }

    async function loadTorrents() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          Connectant a qBittorrent...
        </div>`;

      try {
        await loadConfig();
        const res = await fetch('/api/torrents');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        torrents = await res.json();
        torrents.forEach(t => t.voted = false);
        render();
      } catch (err) {
        app.innerHTML = `
          <div class="error">
            ✗ Error connectant a qBittorrent<br>
            <small>${escapeHtml(err.message)}</small>
          </div>`;
      }
    }

    loadTorrents();
  </script>
</body>
</html>
