<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qbit-voter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="noise"></div>
  <div class="notification-bar" id="notification-bar" hidden>
    <span id="notification-text"></span>
    <button class="notification-close" onclick="app.dismissNotification()">✕</button>
  </div>
  <div class="container">
    <header>
      <div class="header-top">
        <h1><span class="dot"></span> qbit-voter</h1>
        <div class="header-controls">
          <div class="lang-switcher" id="lang-switcher"></div>
          <button class="theme-btn" id="theme-btn" onclick="app.toggleTheme()" title="Toggle theme">☀</button>
          <button class="settings-btn" id="settings-btn" onclick="app.openSettings()" title="Settings">⚙</button>
        </div>
      </div>
      <div class="stats">
        <span id="pending-label"></span>
      </div>
    </header>
    <div class="list-header" id="list-header" hidden>
      <button class="refresh-btn" onclick="app.loadTorrents()" id="refresh-btn"></button>
      <button class="mark-all-btn" id="mark-all-btn" onclick="app.openMarkAllConfirm()"></button>
    </div>
    <main id="app">
      <div class="loading">
        <div class="spinner"></div>
        <span id="loading-text"></span>
      </div>
    </main>
  </div>

  <!-- Mark all confirm modal -->
  <div class="modal-overlay" id="confirm-overlay" onclick="app.closeMarkAllConfirm()">
    <div class="modal confirm-modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="confirm-title"></h2>
        <button class="modal-close" onclick="app.closeMarkAllConfirm()">✕</button>
      </div>
      <p class="confirm-body" id="confirm-body"></p>
      <div class="modal-actions">
        <button type="button" class="btn-modal-cancel" onclick="app.closeMarkAllConfirm()" id="confirm-cancel"></button>
        <button type="button" class="btn-modal-save" id="confirm-ok" onclick="app.markAllLiked()"></button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="app.closeSettings()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="modal-close" onclick="app.closeSettings()">✕</button>
      </div>
      <form id="settings-form" onsubmit="app.saveSettings(event)">
        <div class="form-group">
          <label for="input-qbitUrl" id="label-qbitUrl"></label>
          <input type="url" id="input-qbitUrl" name="qbitUrl" required placeholder="http://localhost:8080">
        </div>
        <div class="form-group">
          <label for="input-qbitUser" id="label-qbitUser"></label>
          <input type="text" id="input-qbitUser" name="qbitUser" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="input-qbitPass" id="label-qbitPass"></label>
          <input type="password" id="input-qbitPass" name="qbitPass" autocomplete="current-password" id="label-qbitPassPlaceholder">
        </div>
        <div class="form-group">
          <label for="input-votedTag" id="label-votedTag"></label>
          <input type="text" id="input-votedTag" name="votedTag" required>
        </div>
        <div class="modal-feedback" id="modal-feedback"></div>
        <div class="modal-actions">
          <button type="button" class="btn-modal-test" id="btn-test" onclick="app.testConnection()"></button>
          <button type="button" class="btn-modal-cancel" onclick="app.closeSettings()" id="btn-cancel"></button>
          <button type="submit" class="btn-modal-save" id="btn-save"></button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
